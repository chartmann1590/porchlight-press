# Pipeline flags live here, NOT in Firebase Remote Config (MASTER_PLAN G17).
# Remote Config (pp_* keys) is client-only. All values have safe defaults so a
# missing file never breaks a run.
staleDaysDefault: 7
requestTimeoutSeconds: 15
maxBodyBytes: 2097152
userAgentContact: "me@charleshartman.com"
feedBaseUrl: "https://chartmann1590.github.io/porchlight-press/"
features:
  enableGdelt: true
  enableNwsAlerts: true
  aiMaxArticlesPerRun: 50
# Phase 3: AI newsroom budget (MASTER_PLAN section 11). 25-min wall-clock
# cap, ~50 briefs per run with 4B. Always uses the 4B primary for quality
# (benchmark 4B 5/8 vs 1.7B 1/30 at run 35983811629); throughput is not the
# goal because the time-budgeted stage publishes top-ranked stories first
# and carries the rest to the next run (4 runs/day).
ai:
  primaryModel: "Qwen3-4B-Q4_K_M"
  fallbackModel: "Qwen3-1.7B-Q8_0"
  overflowThreshold: 9999
  wallClockMinutes: 25
  llamaUrl: "http://127.0.0.1:8080"
  # Optional second AI pass (same model). Off by default; enable only when
  # the time budget allows.
  enableFactCheck: false
# Phase 2: dedup / clustering / ranking thresholds. All have code defaults;
# this file is the operator knob, never a secret.
dedupe:
  # RapidFuzz token_set_ratio (0-100) for normalized headlines.
  nearDupThreshold: 85
  windowHours: 48
clustering:
  windowHours: 72
  # Combined similarity (0-1) needed to join an open cluster.
  similarityThreshold: 0.45
  # Merge threshold for collapsing two clusters into one (older ID survives).
  mergeThreshold: 0.65
  weights:
    tfidf: 0.55
    location: 0.20
    entity: 0.15
    time: 0.10
ranking:
  weights:
    freshness: 0.25
    locality: 0.25
    corroboration: 0.20
    sourcePriority: 0.15
    breaking: 0.10
    categoryBoost: 0.05
  breakingMinSources: 3
  breakingWindowMinutes: 60
  stalePenaltyPerDay: 0.05
  staleGraceHours: 24
  duplicatePenalty: 0.10
state:
  pruneDays: 7
# Phase 4: static publishing caps (section caps from the plan). Regional is
# the plan's locality ladder run-off (county/metro); it gets its own cap.
publish:
  maxStoriesPerEdition: 30
  maxLocalArticles: 20
  maxRegionalArticles: 10
  maxStateArticles: 10
  maxNationalArticles: 10
  maxWorldArticles: 10
# Phase 4: licensed images (Wikimedia Commons, no publisher hotlinking).
images:
  commonsResultsPerQuery: 3
