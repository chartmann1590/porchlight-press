name: news-refresh

# Phase 4: scheduled publication of this open-source project's own static
# edition files to its own Pages site (MASTER_PLAN section 12). Every 6 hours,
# never faster. The run is split so the AI model is picked BEFORE the model
# server starts (no restart ever needed): the process stage (ingest ->
# cluster) writes the newsroom queue and model choice into state/, the
# workflow downloads and serves exactly that model, then the finish stage
# (newsroom -> images -> publish) labels briefs with it. Afterwards `public/`
# deploys to Pages and `state/` commits to the `pipeline-state` branch.
# Nothing commercial on GitHub: no ads, no paid tiers. Model setup reuses the
# ai-newsroom pattern (Release assets preferred, Hugging Face fallback,
# SHA-verified); without a model server every cluster ships as a source card
# and the run still succeeds.
on:
  schedule:
    # Every 6 hours, off the hour (MASTER_PLAN section 12). NEVER add a
    # faster schedule: runner load stays ~2-2.5 h/day within GitHub terms.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:

# One publication at a time; a running edition is never cancelled.
concurrency:
  group: news-refresh
  cancel-in-progress: false

permissions:
  contents: write # state-branch commits
  pages: write # Pages deploy
  id-token: write # Pages deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Restore pipeline state (pipeline-state branch)
        run: |
          mkdir -p state/share
          git fetch origin pipeline-state 2>/dev/null || true
          if git rev-parse --verify origin/pipeline-state >/dev/null 2>&1; then
            git checkout origin/pipeline-state -- state/ || true
            echo "restored state from pipeline-state branch"
          else
            echo "no pipeline-state branch yet (first run)"
          fi
          ls -la state/ || true

      - name: Month stamp (gazetteer cache key)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache full gazetteer (monthly)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/geo-full
          key: gazetteer-full-${{ steps.month.outputs.month }}

      - name: Build full gazetteer (CI-time only, never committed)
        run: |
          mkdir -p "${{ runner.temp }}/geo-full"
          if [ -f "${{ runner.temp }}/geo-full/geo-places.json" ]; then
            echo "gazetteer cache hit, reusing full build"
          else
            python scripts/build_gazetteer.py --mode full \
              --output "${{ runner.temp }}/geo-full/geo-places.json" \
              --postal-output "${{ runner.temp }}/geo-full/geo-postal.json" \
              --max-world-cities 2000 \
              || echo "WARNING: full gazetteer build failed; pipeline falls back to trimmed files"
          fi
          ls -lh "${{ runner.temp }}/geo-full/" || true

      - name: Run processing stage (ingest -> cluster -> model choice)
        run: |
          python -m pipeline.run --stage process --state-dir state \
            --places "${{ runner.temp }}/geo-full/geo-places.json" \
            --postal-places "${{ runner.temp }}/geo-full/geo-postal.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          echo "MODEL_CHOICE=$(cat state/model-choice.txt)" >> "$GITHUB_ENV"

      - name: Resolve models from models.lock
        id: lock
        run: |
          python3 - <<'EOF'
          import json
          import os

          lock = json.load(open('pipeline/ai/models.lock'))
          primary = lock['models']['Qwen3-4B-Q4_K_M']
          fallback = lock['models']['Qwen3-1.7B-Q8_0']

          def emit(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write(f"{name}={value}\n")

          emit('tag', lock['release']['tag'])
          emit('llama_tag', lock['llamaCppTag'])
          emit('primary_file', primary['file'])
          emit('primary_sha', primary['sha256'])
          emit('primary_url', primary['huggingFace'])
          emit('fallback_file', fallback['file'])
          emit('fallback_sha', fallback['sha256'])
          emit('fallback_url', fallback['huggingFace'])
          emit('shard_prefix', primary['file'][: -len('.gguf')])
          EOF

      - name: Select the chosen model (MASTER_PLAN section 11)
        id: model
        run: |
          python3 - <<'EOF'
          import json
          import os

          choice = os.environ['MODEL_CHOICE'].strip()
          lock = json.load(open('pipeline/ai/models.lock'))
          entry = lock['models'][choice]
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as fh:
              fh.write(f"choice={choice}\n")
              fh.write(f"file={entry['file']}\n")
              fh.write(f"sha={entry['sha256']}\n")
              fh.write(f"url={entry['huggingFace']}\n")
              assets = entry.get('releaseAssets', [])
              if isinstance(assets, list) and len(assets) > 1:
                  fh.write("sharded=true\n")
                  fh.write(f"shard_prefix={entry['file'][: -len('.gguf')]}\n")
              else:
                  fh.write("sharded=false\n")
                  fh.write("shard_prefix=\n")
          print(f"serving {choice} ({entry['file']})")
          EOF

      - name: Cache models (both; only the chosen one downloads)
        uses: actions/cache@v6
        with:
          path: ~/.cache/newspaper-models
          key: model-4B-${{ steps.lock.outputs.primary_sha }}-1.7B-${{ steps.lock.outputs.fallback_sha }}

      - name: Download the chosen model (Release, fallback Hugging Face, verify SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.cache/newspaper-models
          cd ~/.cache/newspaper-models
          if [ "${{ steps.model.outputs.sharded }}" = "true" ]; then
            if ls "${{ steps.model.outputs.shard_prefix }}"-*.gguf >/dev/null 2>&1; then
              echo "shards already cached"
            else
              if gh release download "${{ steps.lock.outputs.tag }}" -R "${{ github.repository }}" \
                -p "${{ steps.model.outputs.shard_prefix }}-*.gguf" 2>/dev/null; then
                echo "using Release shards"
              else
                curl -fL --retry 3 -o "${{ steps.model.outputs.file }}" "${{ steps.model.outputs.url }}"
              fi
            fi
          else
            if [ ! -f "${{ steps.model.outputs.file }}" ]; then
              if gh release download "${{ steps.lock.outputs.tag }}" -R "${{ github.repository }}" \
                -p "${{ steps.model.outputs.file }}" 2>/dev/null; then
                echo "using Release asset"
              else
                curl -fL --retry 3 -o "${{ steps.model.outputs.file }}" "${{ steps.model.outputs.url }}"
              fi
            fi
          fi
          ls -lh
          if ls "${{ steps.model.outputs.shard_prefix }}"-*.gguf >/dev/null 2>&1; then
            if python3 - "$GITHUB_WORKSPACE/pipeline/ai/models.lock" "${{ steps.model.outputs.choice }}" <<'EOF'
          import hashlib
          import json
          import sys
          lock = json.load(open(sys.argv[1]))
          assets = lock['models'][sys.argv[2]]['releaseAssets']
          bad = [a['file'] for a in assets
                 if hashlib.sha256(open(a['file'], 'rb').read()).hexdigest() != a['sha256']]
          if bad:
              print(f"shard SHA mismatch: {bad}")
              sys.exit(1)
          print("shard SHAs verified against models.lock")
          EOF
            then
              echo "MODEL_PATH=$PWD/${{ steps.model.outputs.shard_prefix }}-00001-of-00002.gguf" >> "$GITHUB_ENV"
              echo "split shards present and verified"
            else
              echo "shard verification failed; falling back to Hugging Face single file"
              rm -f "${{ steps.model.outputs.shard_prefix }}"-*.gguf
              curl -fL --retry 3 -o "${{ steps.model.outputs.file }}" "${{ steps.model.outputs.url }}"
              echo "${{ steps.model.outputs.sha }}  ${{ steps.model.outputs.file }}" | sha256sum -c -
              echo "MODEL_PATH=$PWD/${{ steps.model.outputs.file }}" >> "$GITHUB_ENV"
            fi
          else
            echo "${{ steps.model.outputs.sha }}  ${{ steps.model.outputs.file }}" | sha256sum -c -
            echo "MODEL_PATH=$PWD/${{ steps.model.outputs.file }}" >> "$GITHUB_ENV"
          fi

      - name: Download llama.cpp (prebuilt CPU, no source build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.lock.outputs.llama_tag }}" -R ggml-org/llama.cpp \
            -p "llama-${{ steps.lock.outputs.llama_tag }}-bin-ubuntu-x64.tar.gz" -D /tmp
          mkdir -p ~/llama && tar -xzf /tmp/llama-*.tar.gz -C ~/llama
          echo "LLAMA_DIR=$(dirname "$(find ~/llama -name llama-server -type f | head -1)")" >> "$GITHUB_ENV"

      - name: Start llama-server (cards-only fallback when unavailable)
        run: |
          export LD_LIBRARY_PATH="$LLAMA_DIR:$LD_LIBRARY_PATH"
          nohup "$LLAMA_DIR/llama-server" -m "$MODEL_PATH" --jinja -c 4096 -np 1 \
            -t "$(nproc)" --host 127.0.0.1 --port 8080 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          echo "WARNING: llama-server did not start; newsroom falls back to source cards"
          cat /tmp/server.log || true
          exit 0

      - name: Run finishing stage (AI newsroom -> images -> publish)
        run: |
          python -m pipeline.run --stage finish --state-dir state --out public \
            --places "${{ runner.temp }}/geo-full/geo-places.json" \
            --postal-places "${{ runner.temp }}/geo-full/geo-postal.json" \
            --model "$(cat state/model-choice.txt)" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deploy URL
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "Pages: ${{ steps.deployment.outputs.page_url }}"
            echo "Feed: ${{ steps.deployment.outputs.page_url }}feeds/us/ny/schenectady/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state (pipeline-state branch)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pipeline-state 2>/dev/null || true
          STATE_TMP="$(mktemp -d)"
          if git rev-parse --verify origin/pipeline-state >/dev/null 2>&1; then
            git clone --branch pipeline-state --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
              "$STATE_TMP"
          else
            mkdir -p "$STATE_TMP" && git -C "$STATE_TMP" init -b pipeline-state
            git -C "$STATE_TMP" remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          mkdir -p "$STATE_TMP/state/share"
          for f in clusters.json http-state.json stories.json normalized.json model-choice.txt queue.json geo-places.json geo-postal.json; do
            if [ -f "state/$f" ]; then
              cp "state/$f" "$STATE_TMP/state/$f"
            fi
          done
          if [ -d state/share ]; then
            rm -f "$STATE_TMP/state/share/"*.html || true
            cp state/share/*.html "$STATE_TMP/state/share/" 2>/dev/null || true
          fi
          git -C "$STATE_TMP" add -f state/ || true
          if git -C "$STATE_TMP" diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git -C "$STATE_TMP" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "pipeline state $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C "$STATE_TMP" push origin pipeline-state
          fi
