name: release

# Phase 9A: signed release AAB + optional Play upload.
# Triggers: version tags (v*) and manual dispatch (choose the Play track).
# The AAB is always uploaded as a workflow artifact (never a GitHub Release).
# Play upload runs only when the PLAY_SERVICE_ACCOUNT_JSON secret exists;
# otherwise the job prints what is missing and still succeeds.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - production

permissions:
  contents: read

jobs:
  guard-ad-ids:
    # Real AdMob IDs live ONLY in GitHub secrets (ADMOB_APP_ID and friends).
    # Debug/test builds use Google's published test IDs. This fails the build
    # if the real publisher ID ever appears anywhere in the tree.
    # NOTE: the guard matches only the ca-app-pub- form, so the public
    # app-ads.txt line (pub-8382831211800454, no ca-app-pub- prefix) is fine.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a real AdMob publisher ID is committed
        # Note: this step's own pattern is excluded so the guard doesn't match itself.
        # android-ci.yml carries the same guard and is excluded for the same reason.
        run: |
          if grep -r 'ca-app-pub-8382831211800454' . --exclude-dir=.git --exclude-dir=.gradle --exclude=release.yml --exclude=android-ci.yml; then
            echo 'Real AdMob IDs must live only in GitHub secrets, never in the repo.'
            exit 1
          fi
          echo 'No real AdMob IDs in the tree.'

  build:
    needs: guard-ad-ids
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve version + track
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="0.0.0+${GITHUB_RUN_NUMBER}"
          fi
          # Fixed offset keeps versionCode monotonic across early manual builds.
          # (Matches VERSION_CODE_OFFSET in app/build.gradle.kts.)
          VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ inputs.track }}"
          else
            TRACK="internal"
          fi
          {
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "TRACK=${TRACK}"
          } >> "$GITHUB_ENV"
          echo "versionCode=${VERSION_CODE} versionName=${VERSION_NAME} track=${TRACK}"

      - name: Write google-services.json from secret (or build without it)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "wrote app/google-services.json from secret"
          else
            echo "GOOGLE_SERVICES_JSON not set; building without it (same as android-ci)"
          fi

      - name: Decode upload keystore to RUNNER_TEMP (never echo, never commit)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UPLOAD_KEYSTORE_BASE64" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$UPLOAD_KEYSTORE_PASSWORD" ] || missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$UPLOAD_KEY_ALIAS" ] || missing="$missing UPLOAD_KEY_ALIAS"
          [ -n "$UPLOAD_KEY_PASSWORD" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing signing secrets:$missing"
            echo "Add them under GitHub > Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload.keystore"
          {
            echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/upload.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${UPLOAD_KEYSTORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${UPLOAD_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${UPLOAD_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "keystore decoded to RUNNER_TEMP (path only, no secrets printed)"

      - name: Build signed release AAB (R8 + resource shrinking)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
        run: |
          missing=""
          [ -n "$ADMOB_APP_ID" ] || missing="$missing ADMOB_APP_ID"
          [ -n "$ADMOB_BANNER_ID" ] || missing="$missing ADMOB_BANNER_ID"
          [ -n "$ADMOB_INTERSTITIAL_ID" ] || missing="$missing ADMOB_INTERSTITIAL_ID"
          [ -n "$ADMOB_NATIVE_ID" ] || missing="$missing ADMOB_NATIVE_ID"
          if [ -n "$missing" ]; then
            echo "Missing AdMob secrets:$missing"
            echo "Add them under GitHub > Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          ./gradlew bundleRelease --no-daemon \
            "-PversionCode=${VERSION_CODE}" \
            "-PversionName=${VERSION_NAME}" \
            "-PadmobAppId=${ADMOB_APP_ID}" \
            "-PadmobBannerId=${ADMOB_BANNER_ID}" \
            "-PadmobInterstitialId=${ADMOB_INTERSTITIAL_ID}" \
            "-PadmobNativeId=${ADMOB_NATIVE_ID}" \
            "-PreleaseKeystorePath=${RELEASE_KEYSTORE_PATH}" \
            "-PreleaseKeystorePassword=${RELEASE_KEYSTORE_PASSWORD}" \
            "-PreleaseKeyAlias=${RELEASE_KEY_ALIAS}" \
            "-PreleaseKeyPassword=${RELEASE_KEY_PASSWORD}"
          ls -lh app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: porchlight-press-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Play (or report missing secret and succeed)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            {
              echo "Play upload skipped: PLAY_SERVICE_ACCOUNT_JSON secret is not set."
              echo ""
              echo "To enable uploads:"
              echo "1. Google Cloud: enable the Play Developer API, create a service account + JSON key."
              echo "2. Play Console > Users and permissions: invite the service account, grant app access."
              echo "3. GitHub > Settings > Secrets and variables > Actions: add PLAY_SERVICE_ACCOUNT_JSON."
              echo "The signed AAB above is still available as a workflow artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Play upload skipped (secret missing); succeeding."
            exit 0
          fi
          echo "PLAY_SA_PRESENT=true" >> "$GITHUB_ENV"

      # Production uses a staged rollout (20%); internal goes to the internal track.
      - name: Upload to Play (internal track)
        if: env.PLAY_SA_PRESENT == 'true' && env.TRACK == 'internal'
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charleshartman.porchlightpress
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }}

      - name: Upload to Play (production, staged rollout 20%)
        if: env.PLAY_SA_PRESENT == 'true' && env.TRACK == 'production'
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charleshartman.porchlightpress
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: inProgress
          userFraction: 0.2
          releaseName: ${{ env.VERSION_NAME }}
