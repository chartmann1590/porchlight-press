name: android-ci

# Phase 5: build + unit tests + lint on PRs touching android/**.
# Phase 9 extends this with emulator instrumented tests.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-ad-ids:
    # Real AdMob IDs live ONLY in GitHub secrets (ADMOB_APP_ID and friends).
    # Debug/test builds use Google's published test IDs. This fails the build
    # if the real publisher ID ever appears anywhere in the tree.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a real AdMob publisher ID is committed
        # Note: this step's own pattern is excluded so the guard doesn't match itself.
        # release.yml carries the same guard and is excluded for the same reason.
        run: |
          if grep -r 'ca-app-pub-8382831211800454' . --exclude-dir=.git --exclude-dir=.gradle --exclude=android-ci.yml --exclude=release.yml; then
            echo 'Real AdMob IDs must live only in GitHub secrets, never in the repo.'
            exit 1
          fi
          echo 'No real AdMob IDs in the tree.'

  build:
    needs: guard-ad-ids
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint
        run: ./gradlew lint --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Debug build
        run: ./gradlew assembleDebug --no-daemon
