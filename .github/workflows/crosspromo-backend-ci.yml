name: crosspromo-backend-ci

# Typecheck + unit tests for the Hartmann cross-promo Cloudflare Worker.
on:
  pull_request:
    paths:
      - "crosspromo-backend/**"
      - "schemas/crosspromo-recommendation-response.schema.json"
      - ".github/workflows/crosspromo-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "crosspromo-backend/**"
      - "schemas/crosspromo-recommendation-response.schema.json"
      - ".github/workflows/crosspromo-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crosspromo-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crosspromo-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
